# Arma 3 dedicated server, as published by Bohemia Interactive on Steam
# (app 233780). Source: Bohemia's "Arma 3: Dedicated Server" and "Arma 3:
# Startup Parameters" pages on the Bohemia Interactive Community wiki.
schema_version: 1
id: arma-3
name: Arma 3
description: The official Arma 3 dedicated server from Bohemia Interactive, installed through SteamCMD.
category: steamcmd

# Only a Steam account that owns Arma 3 can download the server. The user
# logs in to Steam on the probe before the server is installed.
steam:
  login: account

# Bohemia ships a Linux and a Windows server. There is no macOS server.
platforms:
  linux:
    launch:
      executable: arma3server_x64
      arguments: &arguments
        - "-port={{ server.port.game }}"
        - -config=server.cfg
        # The profile (difficulty settings, logs) is kept in profiles/.
        - -name=server
        - -profiles=profiles
        # Start without loading a terrain until a mission is chosen.
        - -world=empty
  windows:
    launch:
      executable: arma3server_x64.exe
      arguments: *arguments

install:
  - type: steamcmd
    app_id: "233780"
  # The server settings file passed with -config, created once with a few
  # defaults. The settings of the server form are written into it, and the
  # owner may add any other setting from Bohemia's "Arma 3: Server Config
  # File" page.
  - type: write_file
    dest: server.cfg
    if_missing: true
    content: |
      // Arma 3 server configuration.
      hostname = "Arma 3 Server";
      password = "";
      passwordAdmin = "";
      maxPlayers = 32;
      motd[] = {};
      persistent = 1;
      verifySignatures = 2;
      BattlEye = 1;

# The server reads no console commands, so the probe asks the process to
# exit.
stop:
  timeout_seconds: 30

# The game takes one port with -port and uses the next ones itself: Steam
# query on port + 1, Steam on port + 2 and BattlEye on port + 4 (port + 3 is
# reserved). They are derived from the game port, so they always follow it.
network:
  ports:
    - name: game
      protocol: udp
      default: 2302
      label: Game
    - name: query
      protocol: udp
      from: game
      offset: 1
      label: Steam query
    - name: steam
      protocol: udp
      from: game
      offset: 2
      label: Steam
    - name: battleye
      protocol: udp
      from: game
      offset: 4
      label: BattlEye

resources: none

variables:
  - name: password
    type: text
    label: Server password
    description: Empty for no password.
    default: ""
    max_length: 64
  - name: admin_password
    type: text
    label: Admin password
    description: Lets a player log in as administrator with "#login". Empty disables it.
    default: ""
    max_length: 64
  - name: max_players
    type: number
    label: Maximum players
    default: 32
    min: 1
    max: 256
    integer: true
  - name: battleye
    type: boolean
    label: BattlEye anti-cheat
    default: true

config_files:
  - path: server.cfg
    format: bohemia

bindings:
  - file: server.cfg
    key: hostname
    value: "{{ server.name }}"
  - file: server.cfg
    key: password
    variable: password
  - file: server.cfg
    key: passwordAdmin
    variable: admin_password
  - file: server.cfg
    key: maxPlayers
    variable: max_players
  - file: server.cfg
    key: BattlEye
    variable: battleye

# Player connections are written to the log in profiles/, not reliably to
# the server output, so there are no console patterns.

# The settings file, the profile with its difficulty settings and saved
# missions, and the missions folder (missions uploaded by the owner). Logs
# and crash dumps are left out.
backup:
  include:
    - server.cfg
    - profiles/
    - mpmissions/
  exclude:
    - profiles/*.rpt
    - profiles/*.log
    - profiles/*.mdmp
    - profiles/*.bidmp
