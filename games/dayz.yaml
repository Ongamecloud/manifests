# DayZ dedicated server, as published by Bohemia Interactive on Steam
# (app 223350). Source: Bohemia's "DayZ Server Configuration" and "Hosting
# a Linux Server" pages on the Bohemia Interactive Community wiki.
schema_version: 1
id: dayz
name: DayZ
description: The official DayZ dedicated server from Bohemia Interactive, installed through SteamCMD.
category: steamcmd

# Only a Steam account that owns DayZ can download the server. The user
# logs in to Steam on the probe before the server is installed.
steam:
  login: account

# Bohemia ships a Linux and a Windows server. There is no macOS server.
platforms:
  linux:
    launch:
      executable: DayZServer
      arguments: &arguments
        - -config=serverDZ.cfg
        - "-port={{ server.port.game }}"
        # Logs, crash dumps and the BattlEye settings go to profiles/.
        - -profiles=profiles
        - -dologs
        - -adminlog
        - -freezecheck
  windows:
    launch:
      executable: DayZServer_x64.exe
      arguments: *arguments

# No "validate": it would put back the original serverDZ.cfg and mission
# files over the ones the owner edited.
install:
  - type: steamcmd
    app_id: "223350"

# The server reads no console commands, so the probe asks the process to
# exit. Persistence is saved regularly while it runs.
stop:
  timeout_seconds: 90

# serverDZ.cfg sets the Steam query port (steamQueryPort, 2305 in the file
# shipped with the server). The probe writes the port the server was given
# there, so the two always match.
network:
  ports:
    - name: game
      protocol: udp
      default: 2302
      label: Game
    - name: query
      protocol: udp
      default: 2305
      label: Steam query

resources: none

variables:
  - name: password
    type: text
    label: Server password
    description: Empty for no password.
    default: ""
    max_length: 64
  - name: admin_password
    type: text
    label: Admin password
    description: Lets a player log in as administrator. Empty disables it.
    default: ""
    max_length: 64
  - name: max_players
    type: number
    label: Maximum players
    default: 60
    min: 1
    max: 127
    integer: true
  - name: map
    type: choice
    label: Map
    description: The mission folder in mpmissions/ the server runs.
    default: dayzOffline.chernarusplus
    choices:
      - value: dayzOffline.chernarusplus
        label: Chernarus
      - value: dayzOffline.enoch
        label: Livonia (players need the DLC)
  - name: disable_third_person
    type: boolean
    label: First-person view only
    default: false
  - name: disable_crosshair
    type: boolean
    label: Hide the crosshair
    default: false

# serverDZ.cfg ships with the server. Only the keys below are written; the
# rest of the file is the owner's.
config_files:
  - path: serverDZ.cfg
    format: bohemia

bindings:
  - file: serverDZ.cfg
    key: hostname
    value: "{{ server.name }}"
  - file: serverDZ.cfg
    key: password
    variable: password
  - file: serverDZ.cfg
    key: passwordAdmin
    variable: admin_password
  - file: serverDZ.cfg
    key: maxPlayers
    variable: max_players
  - file: serverDZ.cfg
    key: steamQueryPort
    value: "{{ server.port.query }}"
    as: number
  - file: serverDZ.cfg
    key: disable3rdPerson
    variable: disable_third_person
  - file: serverDZ.cfg
    key: disableCrosshair
    variable: disable_crosshair
  - file: serverDZ.cfg
    section: Missions.DayZ
    key: template
    variable: map

# Player connections are written to the admin log in profiles/, not to the
# server output, so there are no console patterns.

# The configuration, the mission folders (with the world's persistence in
# storage_*/), the ban and allow lists, and the BattlEye settings. Logs and
# crash dumps are left out.
backup:
  include:
    - serverDZ.cfg
    - mpmissions/
    - profiles/
    - ban.txt
    - whitelist.txt
  exclude:
    - profiles/*.RPT
    - profiles/*.ADM
    - profiles/*.log
    - profiles/*.mdmp
