# Validates every manifest and template against the schema and the rules in
# tools/validate.py, and runs the validator's own tests. Runs on every pull
# request and on main.
name: Validate manifests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the validator
        run: pip install -r tools/requirements.txt

      - name: Validate manifests and templates
        run: python tools/validate.py

      - name: Test the validator
        run: python -m unittest discover -s tools
